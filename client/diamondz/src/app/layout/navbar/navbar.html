<nav class="navbar">

  <!-- LOGO (SEO FIXED) -->
  <a class="logo" routerLink="/">
    <img src="assets/images/logo.png" alt="DiamondZ PPF Logo" />
    <p>Paint Protection Film</p>
  </a>

  <!-- MOBILE MENU BUTTON -->
  <div class="menu-toggle" (click)="toggleMenu()">

    <span [class.active]="isMenuOpen"></span>
    <span [class.active]="isMenuOpen"></span>
    <span [class.active]="isMenuOpen"></span>

  </div>

  <!-- NAVIGATION -->
  <div class="nav-wrapper" [class.open]="isMenuOpen">

    <div class="nav-links">

      <!-- HOME -->
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeMenu()">

        Home
      </a>

      <!-- PRODUCTS (SCALABLE + SEO SAFE) -->
      <div class="dropdown">

        <a class="dropdown-toggle"
           (click)="toggleServices()">

          Products ▾
        </a>

        <div class="dropdown-menu" *ngIf="isServicesOpen">

          <a *ngFor="let service of services"
             [routerLink]="service.route"
             (click)="closeDropdown(); closeMenu()">

            {{ service.name }}

          </a>

        </div>

      </div>

      <!-- ABOUT -->
      <a routerLink="/about"
         routerLinkActive="active"
         (click)="closeMenu()">

        About
      </a>

      <!-- CONTACT -->
      <a routerLink="/contact"
         routerLinkActive="active"
         (click)="closeMenu()">

        Contact
      </a>

       <!-- <a
        routerLink="/admin"
        routerLinkActive="active"
        (click)="closeMenu()">

        Admin

      </a>  -->

    </div>

    <!-- CTA BUTTON -->
    <button class="quote-btn"
            (click)="openQuotePopup()">

      Get A Quote
    </button>

  </div>

</nav>

<!-- QUOTE POPUP -->
<div class="quote-popup-overlay"
     *ngIf="showQuotePopup"
     (click)="closeQuotePopup()">

  <div class="quote-popup-content"
       (click)="$event.stopPropagation()">

    <button class="close-popup"
            (click)="closeQuotePopup()">

      ✕
    </button>

    <app-quote></app-quote>

  </div>
</div>
